name: Render Video to MP4

on:
  workflow_dispatch: # এর মাধ্যমে আপনি অ্যাকশন ট্যাব থেকে ম্যানুয়ালি রান করতে পারবেন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরির ফাইলগুলো রানারে নিয়ে আসা
      - name: Checkout repository
        uses: actions/checkout@v4

      # ২. রানারে FFmpeg ইনস্টল করা
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ৩. জিপ ফাইল আনজিপ করা এবং MP4 রেন্ডার করা
      - name: Unzip and Render MP4
        run: |
          # জিপ ফাইল আনজিপ করা
          unzip sleep-video.zip
          
          # আপনার ফাইলের ধরন অনুযায়ী নিচের যেকোনো একটি কমান্ড ব্যবহার করুন:
          # অপশন এ (যদি ছবির সিরিজ থাকে, যেমন img001.png, img002.png):
          ffmpeg -framerate 30 -i img%03d.png -c:v libx264 -pix_fmt yuv420p output.mp4
          
          # অথবা অপশন বি (যদি অন্য ফরম্যাটের ভিডিওকে mp4 করতে চান):
          # ffmpeg -i input_video.mov -vcodec libx264 -acodec aac output.mp4

      # ৪. রেন্ডার হওয়া MP4 ফাইলটি গিটহাব থেকে ডাউনলোড করার ব্যবস্থা করা
      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-mp4-video
          path: output.mp4
