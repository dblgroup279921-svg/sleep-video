name: Render Remotion Video to MP4

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ১. প্রথমে জিপ ফাইলটি আনজিপ করে সব ফাইল বের করা
      - name: Unzip Project Files
        run: |
          unzip -o sleep-video.zip

      # ২. Node.js সেটআপ করা (লক ফাইল ক্যাশ ছাড়া)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ৩. প্রয়োজনীয় প্যাকেজ এবং ব্রাউজার ইনস্টল করা
      - name: Install Remotion Dependencies and Browser
        run: |
          npm install
          npx remotion browser ensure

      # ৪. ভিডিও রেন্ডার করা
      - name: Render Video
        run: |
          npx remotion render src/Root.tsx main output.mp4 || npx remotion render Root.tsx main output.mp4 || npm run render

      # ৫. রেন্ডার হওয়া MP4 ফাইলটি আপলোড করা
      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-mp4-video
          path: output.mp4
