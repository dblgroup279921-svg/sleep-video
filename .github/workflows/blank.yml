name: Render Remotion Video to MP4

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ১. জিপ ফাইল আনজিপ করা
      - name: Unzip Project Files
        run: |
          unzip -o sleep-video.zip -d project_files || true

      # ২. সঠিক ফোল্ডারে গিয়ে ডিপেন্ডেন্সি ইনস্টল ও রেন্ডার করা
      - name: Install and Render
        run: |
          # সঠিক ডিরেক্টরি সেট করা
          TARGET_DIR="project_files"
          if [ -d "project_files/sleep-video" ]; then
            TARGET_DIR="project_files/sleep-video"
          fi
          
          cd $TARGET_DIR
          
          # ডিপেন্ডেন্সি ইনস্টল ও ব্রাউজার সেটআপ
          npm install --legacy-peer-deps
          npx remotion browser ensure
          
          # package.json এর সঠিক স্ক্রিপ্ট রান করা
          npm run render
          
          # তৈরি হওয়া ভিডিওটি মূল ডিরেক্টরিতে নিয়ে আসা যাতে গিটহাব খুঁজে পায়
          mv out/video.mp4 ../../output.mp4 || mv out/video.mp4 ../output.mp4 || true

      # ৩. রেন্ডার হওয়া MP4 ভিডিওটি গিটহাবে আপলোড করা
      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-mp4-video
          path: output.mp4
          if-no-files-found: error
