name: Render Remotion Video to MP4

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Remotion Dependencies and Browser
        run: |
          # জিপ ফাইলটি আনজিপ করা
          unzip -o sleep-video.zip
          
          # প্রয়োজনীয় প্যাকেজ ইনস্টল করা
          npm install
          
          # Remotion এর জন্য প্রয়োজনীয় ব্রাউজার ইনস্টল করা
          npx remotion browser ensure

      - name: Render Video
        run: |
          # npx remotion render <entry-file> <composition-id> <output-path>
          # সাধারণত entry file হয় Root.tsx অথবা Main.tsx এবং composition id দেখতে package.json চেক করতে হয়।
          # আমরা ডিফল্ট হিসেবে main কম্পোজিশন ট্রাই করছি:
          npx remotion render Root.tsx main output.mp4 || npx remotion render Root.tsx sleep-video output.mp4 || npm run render

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-mp4-video
          path: output.mp4
